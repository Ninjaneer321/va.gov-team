name: Governance Collaboration Cycle touchpoint links

on:
  issues:
    types:
      - opened
      - milestoned
  workflow_dispatch:
    inputs:
      issue-number:
        description: "Issue number to run this workflow for. This is for testing manual runs only."
        required: false
        type: number

permissions:
  id-token: write
  contents: read

jobs:
  link-touchpoint:
    name: Link touchpoint to Collaboration Cycle
    runs-on: ubuntu-latest
    # TODO: Update to final labels when ready to go live.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'CC-touchpoint')
    outputs:
      tests-failed: ${{ steps.unit-tests.outcome == 'failure' }}
      script-failed: ${{ steps.run-script.outcome == 'failure' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github
            scripts/github-actions/gov-team/cc-intake

      - name: Configure AWS Credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-gov-west-1
          role-to-assume: ${{ vars.GOVERNANCE_AWS_ASSUME_ROLE }}
          output-credentials: true

      - name: Get GitHub bot token
        uses: department-of-veterans-affairs/action-inject-ssm-secrets@latest
        with:
          ssm_parameter: /devops/VA_VFS_BOT_GITHUB_TOKEN
          env_variable_name: VA_VFS_BOT_GITHUB_TOKEN

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: "./scripts/github-actions/gov-team/cc-intake/.nvmrc"
          cache: "yarn"
          cache-dependency-path: "./scripts/github-actions/gov-team/cc-intake/yarn.lock"

      - name: Install Node modules
        run: yarn install --frozen-lockfile
        working-directory: ./scripts/github-actions/gov-team/cc-intake

      - name: Run script
        id: run-script
        continue-on-error: true
        run: node src/process-touchpoint-link.js
        working-directory: ./scripts/github-actions/gov-team/cc-intake
        env:
          GITHUB_TOKEN: ${{ env.VA_VFS_BOT_GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue-number }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Run unit tests
        id: unit-tests
        if: steps.run-script.outcome == 'success'
        continue-on-error: true
        run: yarn test
        working-directory: ./scripts/github-actions/gov-team/cc-intake

      - name: Fail job if script failed
        if: steps.run-script.outcome == 'failure'
        run: exit 1

  slack-notify-failure:
    name: Notify Slack of script failure
    runs-on: ubuntu-latest
    needs: link-touchpoint
    if: always() && needs.link-touchpoint.outputs.script-failed == 'true'

    steps:
      - name: Configure AWS Credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-gov-west-1
          role-to-assume: ${{ vars.GOVERNANCE_AWS_ASSUME_ROLE }}
          output-credentials: true

      - name: Get Slack bot token
        uses: department-of-veterans-affairs/action-inject-ssm-secrets@latest
        with:
          ssm_parameter: /devops/github_actions_slack_bot_user_token
          env_variable_name: SLACK_BOT_TOKEN

      - name: Notify Slack
        uses: slackapi/slack-github-action@v3.0.1
        with:
          method: chat.postMessage
          token: ${{ env.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "C088E31CS6M",
              "text": "Touchpoint linking script failed",
              "attachments": [{
                "color": "#b21d38",
                "blocks": [{
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "The touchpoint linking script failed while processing issue <${{ github.server_url }}/${{ github.repository }}/issues/${{ github.event.issue.number || github.event.inputs.issue-number }}|#${{ github.event.issue.number || github.event.inputs.issue-number }}>.\n\nThis script links touchpoint tickets to their Collaboration Cycle ticket. The touchpoint ticket may be missing its Collab Cycle ticket link, and the Collab Cycle ticket may still show the \"Initiate\" link instead of the touchpoint ticket link.\n\nPlease check the run <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|#${{ github.run_id }}> for details."
                  }
                }]
              }]
            }

  slack-notify-unit-test-failure:
    name: Notify Slack of unit test failure
    runs-on: ubuntu-latest
    needs: link-touchpoint
    if: needs.link-touchpoint.result == 'success' && needs.link-touchpoint.outputs.tests-failed == 'true'

    steps:
      - name: Configure AWS Credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-gov-west-1
          role-to-assume: ${{ vars.GOVERNANCE_AWS_ASSUME_ROLE }}
          output-credentials: true

      - name: Get Slack bot token
        uses: department-of-veterans-affairs/action-inject-ssm-secrets@latest
        with:
          ssm_parameter: /devops/github_actions_slack_bot_user_token
          env_variable_name: SLACK_BOT_TOKEN

      - name: Notify Slack
        uses: slackapi/slack-github-action@v3.0.1
        with:
          method: chat.postMessage
          token: ${{ env.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "C088E31CS6M",
              "text": "Touchpoint linking unit tests failed",
              "attachments": [{
                "color": "#b21d38",
                "blocks": [{
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "Automated tests for the touchpoint linking script failed on issue <${{ github.server_url }}/${{ github.repository }}/issues/${{ github.event.issue.number || github.event.inputs.issue-number }}|#${{ github.event.issue.number || github.event.inputs.issue-number }}>.\n\nThe script ran successfully, but the tests that verify its output failed. Please check that the touchpoint ticket has the correct Collab Cycle ticket link and the Collab Cycle ticket has the correct touchpoint link.\n\nNotify a developer to look at the failed unit tests in run <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|#${{ github.run_id }}>."
                  }
                }]
              }]
            }
