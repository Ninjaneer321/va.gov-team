name: Set Bug Identified status when labeled bug

# Triggers when an issue is labeled
on:
  issues:
    types:
      - labeled

jobs:
  set_bug_status:
    # Only run when the "ADE Research Feedback" label is added
    if: github.event.label.name == 'ADE Research Feedback'
    runs-on: ubuntu-latest
    steps:

      # Step 1: Get the project data (field IDs and option IDs)
      - name: Get project data
        env:
          GH_TOKEN: ${{ secrets.ADE_BUG_STATUS }}
          ORGANIZATION: department-of-veterans-affairs
          PROJECT_NUMBER: 1959
        run: |
          gh api graphql -f query='
            query($org: String!, $number: Int!) {
              organization(login: $org){
                projectV2(number: $number) {
                  id
                  fields(first:20) {
                    nodes {
                      ... on ProjectV2Field {
                        id
                        name
                      }
                      ... on ProjectV2SingleSelectField {
                        id
                        name
                        options {
                          id
                          name
                        }
                      }
                    }
                  }
                }
              }
            }' -f org=$ORGANIZATION -F number=$PROJECT_NUMBER > project_data.json

          # DEBUG: Print the full project data so we can see all fields and options
          echo "=== FULL PROJECT DATA ==="
          cat project_data.json | jq .

          echo ""
          echo "=== ALL FIELD NAMES ==="
          jq '.data.organization.projectV2.fields.nodes[] | .name' project_data.json

          echo ""
          echo "=== ALL SINGLE SELECT FIELDS WITH OPTIONS ==="
          jq '.data.organization.projectV2.fields.nodes[] | select(.options != null) | {name: .name, options: .options}' project_data.json

          echo ""
          echo "=== LOOKING FOR STATUS FIELD ==="
          STATUS_FIELD=$(jq '.data.organization.projectV2.fields.nodes[] | select(.name== "Status")' project_data.json)
          echo "$STATUS_FIELD"

          echo ""
          echo "=== LOOKING FOR BUG IDENTIFIED OPTION ==="
          BUG_OPTION=$(jq '.data.organization.projectV2.fields.nodes[] | select(.name== "Status") | .options[] | select(.name=="Bug Identified")' project_data.json)
          echo "$BUG_OPTION"

          # Set env vars
          echo 'PROJECT_ID='$(jq '.data.organization.projectV2.id' project_data.json) >> $GITHUB_ENV
          echo 'STATUS_FIELD_ID='$(jq '.data.organization.projectV2.fields.nodes[] | select(.name== "Status") | .id' project_data.json) >> $GITHUB_ENV
          echo 'BUG_IDENTIFIED_OPTION_ID='$(jq '.data.organization.projectV2.fields.nodes[] | select(.name== "Status") | .options[] | select(.name=="Bug Identified") | .id' project_data.json) >> $GITHUB_ENV

          # DEBUG: Print the extracted IDs
          echo ""
          echo "=== EXTRACTED IDS ==="
          echo "PROJECT_ID: $(jq '.data.organization.projectV2.id' project_data.json)"
          echo "STATUS_FIELD_ID: $(jq '.data.organization.projectV2.fields.nodes[] | select(.name== "Status") | .id' project_data.json)"
          echo "BUG_IDENTIFIED_OPTION_ID: $(jq '.data.organization.projectV2.fields.nodes[] | select(.name== "Status") | .options[] | select(.name=="Bug Identified") | .id' project_data.json)"

      # Step 2: Add the issue to the project (if not already there)
      - name: Add issue to project
        env:
          GH_TOKEN: ${{ secrets.ADE_BUG_STATUS }}
          ISSUE_ID: ${{ github.event.issue.node_id }}
        run: |
          item_id="$( gh api graphql -f query='
            mutation($project:ID!, $issue:ID!) {
              addProjectV2ItemById(input: {projectId: $project, contentId: $issue}) {
                item {
                  id
                }
              }
            }' -f project=$PROJECT_ID -f issue=$ISSUE_ID --jq '.data.addProjectV2ItemById.item.id')"

          echo 'ITEM_ID='$item_id >> $GITHUB_ENV

          # DEBUG: Print the item ID
          echo "=== ITEM ID ==="
          echo "$item_id"

      # Step 3: Set the Status field to "Bug Identified"
      - name: Set status to Bug Identified
        env:
          GH_TOKEN: ${{ secrets.ADE_BUG_STATUS }}
        run: |
          # DEBUG: Print all values before the mutation
          echo "=== VALUES BEING SENT ==="
          echo "PROJECT_ID: $PROJECT_ID"
          echo "ITEM_ID: $ITEM_ID"
          echo "STATUS_FIELD_ID: $STATUS_FIELD_ID"
          echo "BUG_IDENTIFIED_OPTION_ID: $BUG_IDENTIFIED_OPTION_ID"

          gh api graphql -f query='
            mutation (
              $project: ID!
              $item: ID!
              $status_field: ID!
              $status_value: String!
            ) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $project
                itemId: $item
                fieldId: $status_field
                value: {
                  singleSelectOptionId: $status_value
                }
              }) {
                projectV2Item {
                  id
                }
              }
            }' -f project=$PROJECT_ID -f item=$ITEM_ID -f status_field=$STATUS_FIELD_ID -f status_value=$BUG_IDENTIFIED_OPTION_ID --silent
