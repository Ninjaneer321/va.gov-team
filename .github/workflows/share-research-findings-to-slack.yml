name: Share Research Findings to Slack

on:
  push:
    paths:
      - 'products/**/[Ff]indings.md'
      - 'products/**/[Rr]eport.md'
      - 'products/**/[Ii]nsights.md'
      - 'products/**/[Rr]esearch-[Ff]indings.md'
      - 'products/**/[Rr]esearch-[Rr]eport.md'
      - 'products/**/[Rr]esearch-[Ii]nsights.md'
      - 'products/**/[Uu]ser-[Rr]esearch-[Ff]indings.md'
      - 'products/**/[Uu]ser-[Rr]esearch-[Rr]eport.md'
      - 'products/**/[Ss]tudy-[Ff]indings.md'
      - 'products/**/[Ss]tudy-[Rr]eport.md'
      - 'teams/**/[Ff]indings.md'
      - 'teams/**/[Rr]eport.md'
      - 'teams/**/[Ii]nsights.md'
      - 'teams/**/[Rr]esearch-[Ff]indings.md'
      - 'teams/**/[Rr]esearch-[Rr]eport.md'
      - 'teams/**/[Rr]esearch-[Ii]nsights.md'
      - 'teams/**/[Uu]ser-[Rr]esearch-[Ff]indings.md'
      - 'teams/**/[Uu]ser-[Rr]esearch-[Rr]eport.md'
      - 'teams/**/[Ss]tudy-[Ff]indings.md'
      - 'teams/**/[Ss]tudy-[Rr]eport.md'
    branches:
      - master
      - main
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      research_file_path:
        description: 'Path to specific research file (optional - leave blank to process all eligible files)'
        required: false
        type: string
      ignore_time_delay:
        description: 'Ignore 14-day waiting period (for testing)'
        required: false
        type: boolean
        default: false
      ignore_completeness_check:
        description: 'Ignore report completeness check (for testing)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

jobs:
  share-research-findings:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Optimized checkout for large repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            .github/workflows/
            scripts/github-actions/
            products/
            teams/
            platform/research/copilot-prompts/
          sparse-checkout-cone-mode: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install pyyaml

      - name: Find eligible research files
        id: find-files
        run: |
          python scripts/github-actions/share-research-findings-to-slack/research_finder.py \
            "${{ github.event_name }}" \
            "${{ github.event.inputs.research_file_path }}" \
            "${{ github.event.inputs.ignore_time_delay }}" \
            "${{ github.event.inputs.ignore_completeness_check }}"

      - name: Process and extract research content
        if: steps.find-files.outputs.skip != 'true'
        run: |
          python scripts/github-actions/share-research-findings-to-slack/research_processor.py \
            "${{ steps.find-files.outputs.eligible_files }}"

      - name: Generate research short story via LLM
        if: steps.find-files.outputs.skip != 'true' && env.RESEARCH_FILE
        env:
          GH_MODELS_TOKEN: ${{ secrets.WORKFLOWS_PERMISSIONS }}
        run: |
          python scripts/github-actions/share-research-findings-to-slack/short_story_generator.py \
            "platform/research/copilot-prompts/research-report/research-short-story-prompt.md" \
            "${{ env.RESEARCH_FILE }}"

      - name: Build Slack payload
        if: steps.find-files.outputs.skip != 'true' && env.RESEARCH_FILE
        id: build-payload
        run: |
          python3 << 'PYTHON_SCRIPT'
          import json
          import os
          import re

          def escape_for_slack_mrkdwn(text):
              """Escape special characters while preserving Slack mrkdwn formatting."""
              protected = []
              def _protect(match):
                  idx = len(protected)
                  token = f"__SLACK_LINK_{idx}__"
                  protected.append((token, match.group(0)))
                  return token

              text = re.sub(r'<[^|>]+?\|[^>]+?>', _protect, text)
              text = text.replace('<', '&lt;').replace('>', '&gt;')
              for token, link in protected:
                  text = text.replace(token, link)
              return text

          def markdown_to_slack_mrkdwn(text):
              """Convert markdown formatting to Slack mrkdwn."""
              lines = text.split('\n')
              converted = []

              for line in lines:
                  header_match = re.match(r'^(#{1,3})\s+(.*)', line)
                  if header_match:
                      converted.append(f"*{header_match.group(2).strip()}*")
                      continue

                  line = re.sub(r'\*\*(.+?)\*\*', r'*\1*', line)

                  if re.match(r'^---+\s*$', line):
                      continue

                  converted.append(line)

              return '\n'.join(converted)

          def split_into_slack_blocks(text, max_chars=2900):
              """
              Split text into Slack-safe section chunks.

              Strategy:
              1. Split at Slack bold-only heading lines to preserve section boundaries.
              2. For oversized sections, split at paragraph boundaries.
              3. If a paragraph is still oversized, hard-split by character length.

              max_chars defaults to 2900 to stay below Slack's 3000-char section limit.
              """
              PARAGRAPH_SEPARATOR = '\n\n'
              SLACK_HEADING_PATTERN = r'^\*[^*\n]+\*\s*$'

              def hard_split_text(oversized_text):
                  return [oversized_text[i:i + max_chars] for i in range(0, len(oversized_text), max_chars)]

              def append_hard_split(target_chunks, oversized_text):
                  target_chunks.extend(hard_split_text(oversized_text))

              # Split on lines like "*Section Heading*" in converted Slack mrkdwn using re.MULTILINE.
              heading_matches = list(re.finditer(SLACK_HEADING_PATTERN, text, flags=re.MULTILINE))
              sections = []
              if heading_matches:
                  first_start = heading_matches[0].start()
                  if first_start > 0:
                      preamble = text[:first_start].strip('\n')
                      if preamble:
                          sections.append(preamble)
                  for idx, match in enumerate(heading_matches):
                      start = match.start()
                      end = heading_matches[idx + 1].start() if idx + 1 < len(heading_matches) else len(text)
                      section_text = text[start:end].strip('\n')
                      if section_text:
                          sections.append(section_text)
              else:
                  fallback = text.strip('\n')
                  if fallback:
                      sections.append(fallback)

              chunks = []
              for section in sections:
                  if len(section) <= max_chars:
                      chunks.append(section)
                      continue

                  paragraphs = section.split(PARAGRAPH_SEPARATOR)
                  current_chunk = ''
                  for para in paragraphs:
                      potential_chunk = f"{current_chunk}{PARAGRAPH_SEPARATOR}{para}" if current_chunk else para
                      if len(potential_chunk) > max_chars:
                          if current_chunk:
                              chunks.append(current_chunk)
                              if len(para) > max_chars:
                                  append_hard_split(chunks, para)
                                  current_chunk = ''
                              else:
                                  current_chunk = para
                          else:
                              append_hard_split(chunks, para)
                              current_chunk = ''
                      else:
                          current_chunk = potential_chunk

                  if current_chunk:
                      chunks.append(current_chunk)

              return [chunk.strip('\n') for chunk in chunks if chunk.strip('\n')]

          research_title = os.environ.get('RESEARCH_TITLE', 'Research Findings')
          product_path = os.environ.get('PRODUCT_PATH', '')
          study_date = os.environ.get('STUDY_DATE', '')
          short_story = os.environ.get('SHORT_STORY', '').strip()
          research_file = os.environ.get('RESEARCH_FILE', '')
          event_name = '${{ github.event_name }}'
          repository = '${{ github.repository }}'
          sha = '${{ github.sha }}'

          if not short_story:
              raise ValueError(
                  "SHORT_STORY environment variable is empty. Verify GH_MODELS_TOKEN is configured "
                  "and check the 'Generate research short story via LLM' step logs for API or prompt parsing errors."
              )

          if event_name == 'workflow_dispatch':
              context_message = "🧪 _Test notification - not tracked as shared_"
          else:
              context_message = "✨ _Shared after 14-day revision period_"

          blocks = [
              {
                  "type": "section",
                  "text": {"type": "mrkdwn", "text": "New research findings are available! 👇"}
              },
              {
                  "type": "header",
                  "text": {
                      "type": "plain_text",
                      "text": "📊 New Research Findings Available",
                      "emoji": True
                  }
              },
              {
                  "type": "section",
                  "fields": [
                      {"type": "mrkdwn", "text": f"*Study:*\n{research_title}"},
                      {"type": "mrkdwn", "text": f"*Product Area:*\n{product_path}"},
                      {"type": "mrkdwn", "text": f"*Date:*\n{study_date}"}
                  ]
              },
              {"type": "divider"}
          ]

          converted_short_story = markdown_to_slack_mrkdwn(short_story)
          escaped_short_story = escape_for_slack_mrkdwn(converted_short_story)
          short_story_blocks = split_into_slack_blocks(escaped_short_story)

          if short_story_blocks:
              blocks.append({
                  "type": "section",
                  "text": {"type": "mrkdwn", "text": f"*Research Short Story:*\n\n{short_story_blocks[0]}"}
              })
              for block_text in short_story_blocks[1:]:
                  blocks.append({
                      "type": "section",
                      "text": {"type": "mrkdwn", "text": block_text}
                  })

          blocks.append({"type": "divider"})
          blocks.append({
              "type": "actions",
              "elements": [{
                  "type": "button",
                  "text": {"type": "plain_text", "text": "📖 Read Full Report", "emoji": True},
                  "url": f"https://github.com/{repository}/blob/{sha}/{research_file}",
                  "style": "primary"
              }]
          })
          
          report_url = f"https://github.com/{repository}/blob/{sha}/{research_file}"
          blocks.append({
              "type": "context",
              "elements": [{"type": "mrkdwn", "text": f"{context_message}\n📎 <{report_url}|View full report on GitHub>"}]
          })

          payload = {
              "text": f"📊 New Research Findings Available: {research_title}",
              "blocks": blocks
          }

          with open('slack_payload.json', 'w') as f:
              json.dump(payload, f, indent=2)

          print("Slack payload built successfully")
          print(f"Short story length: {len(short_story)} chars")
          PYTHON_SCRIPT

      - name: Send Slack notification - Success
        if: steps.find-files.outputs.skip != 'true' && env.RESEARCH_FILE
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: ${{ secrets.SLACK_RSRCH_FINDINGS_CHANNEL_ID }}
          payload-file-path: slack_payload.json
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_ACCESS_TOKEN_RSRCH_OPS }}

      - name: Send Slack notification - Error
        if: steps.find-files.outputs.skip == 'true' && steps.find-files.outputs.error_message && github.event_name == 'workflow_dispatch'
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: ${{ secrets.SLACK_RSRCH_FINDINGS_CHANNEL_ID }}
          payload: |
            {
              "text": "❌ Research File Not Found",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "❌ *Could not find the specified research file*\n\n`${{ steps.find-files.outputs.error_message }}`\n\nPlease check the file path and try again."
                  }
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_ACCESS_TOKEN_RSRCH_OPS }}

      - name: Update tracking file
        if: steps.find-files.outputs.skip != 'true' && github.event_name != 'workflow_dispatch' && env.RESEARCH_FILE
        run: |
          echo "${{ env.RESEARCH_FILE }}" >> .github/workflows/shared-research-files.log

      - name: Commit tracking file
        if: steps.find-files.outputs.skip != 'true' && github.event_name != 'workflow_dispatch' && env.RESEARCH_FILE
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Track shared research file: ${{ env.RESEARCH_FILE }}"
          file_pattern: .github/workflows/shared-research-files.log
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
